name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Release verification
    uses: ./.github/workflows/verify.yml

  docker:
    name: Docker builds
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build node image
        run: docker build -f Dockerfile -t fuckipv6:ci .
