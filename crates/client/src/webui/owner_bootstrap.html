<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>fuckipv6 · Owner setup</title>
  <style nonce="__CSP_NONCE__">
    :root{color-scheme:light;--paper:#f2ede2;--ink:#1f1c17;--muted:#6f6555;--field:#e9e2d3;--field-focus:#e0d8c6;--bad:#8e2f22}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .shell{min-height:100vh;display:grid;align-content:center;justify-items:center;padding:56px 24px}
    .panel{width:min(360px,100%);background:transparent;border:0;border-radius:0;box-shadow:none;padding:0}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}
    .brand{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
    .language{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
    .language select{border:0;border-radius:0;background:transparent;color:var(--ink);font:inherit;padding:2px 0;appearance:none}
    header{padding:0}
    .title{font-size:32px;line-height:1.15;letter-spacing:-.02em;font-weight:600;margin:0}
    .sub{display:none}
    main{padding:18px 0 0}
    .step{display:none}.step.active{display:block}
    .step-head{display:block;margin:0 0 14px}
    .step-no{display:none}
    .step-title{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
    .hint{display:none}
    label{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
    .code,input{display:block;width:100%;border:0;border-radius:0;background:var(--field);color:var(--ink);padding:14px 14px;font:inherit;outline:none}
    .code:focus,input:focus{background:var(--field-focus);box-shadow:none}
    button{display:block;width:100%;border:0;border-radius:0;background:var(--ink);color:#f5f0e5;padding:0 16px;height:46px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
    button:hover:not(:disabled){background:#37322a}
    button:disabled{background:#d3cbba;color:var(--muted);cursor:not-allowed}
    .actions{display:block;margin-top:16px}
    .secondary{background:var(--field);color:var(--ink);margin-top:0}
    .status{display:none;margin-top:16px;padding:0;border:0;border-radius:0;background:transparent;color:var(--muted);white-space:pre-wrap;font-size:12px}
    .status.show{display:block}
    .status.error{color:var(--bad)}
    .status.ok{color:var(--ink)}
    .status.warn{color:var(--muted)}
    .recovery{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:0}
    .recovery .code{font-size:14px;overflow-wrap:anywhere}
    .check{display:flex;align-items:flex-start;gap:10px;margin:16px 0 0;color:var(--ink);font-size:13px;text-transform:none;letter-spacing:0}
    .check input{width:auto;margin-top:3px;background:var(--field)}
    .warning{display:none}
    footer{display:none}
    .dot{display:none}
    .hidden{display:none!important}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    @media(max-width:600px){.shell{padding:32px 18px}.title{font-size:26px}.recovery{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel" aria-labelledby="page-title">
      <header>
        <div class="topline"><div class="brand">fuckipv6</div><label class="language"><select id="language-preference" data-i18n-aria-label="common.language"><option value="system" data-i18n="lang.system">System</option><option value="zh-CN" data-i18n="lang.zh_cn">简体中文</option><option value="en" data-i18n="lang.en">English</option></select></label></div>
        <h1 id="page-title" class="title" data-i18n="owner_auth.bootstrap.local_title">Local owner setup</h1>
      </header>
      <main>
        <section id="step-code" class="step active" aria-labelledby="code-title">
          <div class="step-head"><span class="step-no">1</span><span id="code-title" class="step-title" data-i18n="owner_auth.bootstrap.verify_title">Verify the one-time bootstrap code</span></div>
          <label for="bootstrap-code" data-i18n="owner_auth.bootstrap.code_label">Bootstrap code</label>
          <input id="bootstrap-code" class="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="owner_auth.bootstrap.code_placeholder" placeholder="Paste the bootstrap code from the terminal">
          <div class="actions"><button id="start-passkey" type="button" data-i18n="owner_auth.bootstrap.verify_button">Verify and register passkey</button></div>
        </section>

        <section id="step-recovery" class="step" aria-labelledby="recovery-title">
          <div class="step-head"><span class="step-no">2</span><span id="recovery-title" class="step-title" data-i18n="owner_auth.bootstrap.recovery_title">Save the recovery code offline</span></div>
          <label for="recovery-code" data-i18n="owner_auth.bootstrap.recovery_label">Recovery code</label>
          <div class="recovery">
            <code id="recovery-code" class="code" tabindex="0"></code>
            <button id="copy-recovery" class="secondary" type="button" data-i18n="common.copy">Copy</button>
          </div>
          <label class="check" for="recovery-saved"><input id="recovery-saved" type="checkbox"><span id="recovery-confirmation" data-i18n="owner_auth.recovery.confirmation">I saved the recovery code offline.</span></label>
          <div class="actions"><button id="confirm-recovery" type="button" disabled data-i18n="owner_auth.bootstrap.complete_button">Complete owner setup</button></div>
        </section>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </main>
      <footer><span id="bootstrap-footer"></span></footer>
    </section>
  </div>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/owner_bootstrap.js"></script>
</body>
</html>
