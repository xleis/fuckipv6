name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64 package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release --workspace

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          package="fuckipv6-linux-x86_64-${version}"
          mkdir -p "dist/${package}/bin" "dist/${package}/examples" "dist/${package}/scripts"
          cp target/release/fuckipv6 "dist/${package}/bin/"
          cp target/release/fuckipv6-coordinator "dist/${package}/bin/"
          cp README.md docs/QUICKSTART.md docs/DEPLOYMENT.md "dist/${package}/"
          cp examples/client.toml.example examples/coordinator.toml.example "dist/${package}/examples/"
          cp scripts/install-client.sh scripts/install-coordinator.sh scripts/fuckipv6-client.service scripts/fuckipv6-coordinator.service "dist/${package}/scripts/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            dist/*.tar.gz
            dist/*.sha256

  windows:
    name: Windows x86_64 package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release --workspace --target x86_64-pc-windows-gnu

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          package="fuckipv6-windows-x86_64-${version}"
          mkdir -p "dist/${package}"
          cp target/x86_64-pc-windows-gnu/release/fuckipv6.exe "dist/${package}/"
          cp target/x86_64-pc-windows-gnu/release/fuckipv6-coordinator.exe "dist/${package}/"
          cp setup_windows.ps1 setup_windows.bat README_WINDOWS.md QUICKSTART_WINDOWS.md WINDOWS_TEST_CHECKLIST.md "dist/${package}/"
          cp examples/client.toml.example examples/coordinator.toml.example "dist/${package}/"
          (cd dist && zip -r "${package}.zip" "${package}")
          sha256sum "dist/${package}.zip" > "dist/${package}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.sha256

  macos:
    name: macOS ${{ matrix.arch }} package
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: arm64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          package="fuckipv6-macos-${{ matrix.arch }}-${version}"
          mkdir -p "dist/${package}/bin" "dist/${package}/examples"
          cp "target/${{ matrix.target }}/release/fuckipv6" "dist/${package}/bin/"
          cp "target/${{ matrix.target }}/release/fuckipv6-coordinator" "dist/${package}/bin/"
          cp README.md docs/QUICKSTART.md docs/DEPLOYMENT.md "dist/${package}/"
          cp examples/client.toml.example examples/coordinator.toml.example "dist/${package}/examples/"
          cp scripts/install-macos-client.sh scripts/install-macos-coordinator.sh scripts/fuckipv6-client.plist scripts/fuckipv6-coordinator.plist "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          shasum -a 256 "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-package
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: fuckipv6 ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
