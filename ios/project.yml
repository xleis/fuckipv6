name: FuckIpv6
options:
  bundleIdPrefix: com.lingxifox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The Rust build phase runs cargo, which needs the filesystem.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R9UJHHAZQ4
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The Rust bridge ships arm64 slices only, and Apple Silicon is the only
    # supported development host.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  FuckIpv6:
    type: application
    platform: iOS
    sources:
      - path: FuckIpv6
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.fuckipv6
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: fuckipv6
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to the fuckipv6 coordinator on your local network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: FuckIpv6/FuckIpv6.entitlements
    dependencies:
      - target: FuckIpv6Tunnel
        embed: true
    scheme:
      testTargets:
        - FuckIpv6Tests
  FuckIpv6Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: FuckIpv6Tunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.fuckipv6.tunnel
        PRODUCT_NAME: FuckIpv6Tunnel
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FuckIpv6Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: FuckIpv6Tunnel/FuckIpv6Tunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: FuckIpv6Tunnel/FuckIpv6Tunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../crates/ios-bridge/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Rust/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lfuckipv6_ios
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Build Rust bridge
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-rust.sh"

  # Host-less unit tests for the tunnel extension. The extension target itself
  # cannot be imported by tests, so the shared and data-plane sources are
  # compiled into the test bundle against the same Rust static library.
  FuckIpv6Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
      - path: FuckIpv6Tunnel/Bridge
      - path: FuckIpv6Tunnel/Data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxifox.fuckipv6.tests
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: FuckIpv6Tunnel/FuckIpv6Tunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../crates/ios-bridge/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Rust/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lfuckipv6_ios
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Build Rust bridge
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-rust.sh"
