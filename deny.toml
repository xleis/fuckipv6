    { crate = "inout@0.1.4", reason = "required by cipher 0.4.4" },
    { crate = "itertools@0.13.0", reason = "required by gpui-base 0.8.0" },
    { crate = "keccak@0.1.6", reason = "required by sha3 0.10.9" },
    { crate = "miniz_oxide@0.8.9", reason = "required by exr 1.74.2" },
    { crate = "objc2@0.5.3", reason = "required by accesskit_macos 0.26.3" },
