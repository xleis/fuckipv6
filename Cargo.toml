[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/client",
    "crates/coordinator",
    "crates/secure-session",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["fuckipv6 contributors"]
license = "MIT"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# QUIC实现
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"
x509-parser = "0.16"

# TUN设备
tun = "0.6"

# 网络工具
socket2 = "0.6"
ipnet = "2.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

# 序列化
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

# Web服务
axum = "0.8"
tokio-tungstenite = "0.29"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# 加密
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
hmac = "0.12"
blake3 = "1"
getrandom = { version = "0.3", features = ["std"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes-gcm = { version = "0.10", features = ["zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
zeroize = "1"
ml-kem = { version = "=0.3.3", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "getrandom", "zeroize"] }

# 命令行
clap = { version = "4", features = ["derive"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 配置
toml = "0.8"
serde_json = "1"
urlencoding = "2.1"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
anyhow = "1"
thiserror = "1"

# 实用工具
futures = "0.3"
bytes = "1"
criterion = "0.5"
