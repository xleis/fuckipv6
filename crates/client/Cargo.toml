[package]
name = "fuckipv6-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["gpui-shell"]
gpui-shell = ["dep:gpui"]
userspace-nat-prototype = []

[[bin]]
name = "fuckipv6"
path = "src/main.rs"

[dependencies]
fuckipv6-common = { version = "0.3.0", path = "../common" }
fuckipv6-coordinator = { version = "0.3.0", path = "../coordinator" }
fuckipv6-secure-session = { version = "0.3.0", path = "../secure-session" }

ed25519-dalek = { workspace = true }
thiserror = { workspace = true }

tokio = { workspace = true }
tun = { workspace = true }
socket2 = { workspace = true }
quinn = { workspace = true }
ipnet = { workspace = true }
reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

axum = { workspace = true, features = ["ws"] }
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }

clap = { workspace = true }
tracing = { workspace = true }

chrono = { workspace = true }
getrandom = { workspace = true }

anyhow = { workspace = true }

# GPUI is a native desktop dependency. Unsupported targets keep the capability
# disabled instead of reporting a browser-hosted surface as GPUI.
[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), windows, target_os = "macos"))'.dependencies]
gpui = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

# Windows TUN support
[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# macOS utun support
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
