[package]
name = "fuckipv6-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["gpui-shell"]
gpui-shell = ["dep:gpui", "dep:gpui-platform", "dep:gpui-base"]
secure-lock-metrics = []
userspace-nat-prototype = []

[[bin]]
name = "fuckipv6"
path = "src/main.rs"

[dependencies]
fuckipv6-common = { version = "0.3.0", path = "../common" }
fuckipv6-coordinator = { version = "0.3.0", path = "../coordinator" }
fuckipv6-secure-session = { version = "0.3.0", path = "../secure-session" }

ed25519-dalek = { workspace = true }
thiserror = { workspace = true }

tokio = { workspace = true }
tun = { workspace = true }
socket2 = { workspace = true }
quinn = { workspace = true }
ipnet = { workspace = true }
reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
schemars = { workspace = true }
blake3 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
unicode-segmentation = { workspace = true }

axum = { workspace = true, features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { workspace = true }
rustls-pemfile = "2"
x509-parser = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
interprocess = { workspace = true }
fs2 = { workspace = true }
getifs = "0.8"

clap = { workspace = true }
tracing = { workspace = true }

chrono = { workspace = true }
getrandom = { workspace = true }
rpassword = "7.4"

anyhow = { workspace = true }
bytes = { workspace = true }
webauthn-rs = { version = "0.6.2", default-features = false }
base64 = "0.22"
subtle = "2"

# GPUI is a native desktop dependency. Unsupported targets keep the capability
# disabled instead of reporting a browser-hosted surface as GPUI.
[dev-dependencies]
rcgen = { workspace = true }

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), windows, target_os = "macos"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-platform = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), windows, target_os = "macos"))'.dependencies]
gpui = { workspace = true, optional = true }
gpui-platform = { workspace = true, optional = true }
gpui-base = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

# Windows TUN support
[target.'cfg(windows)'.dependencies]
wintun = "0.5"
widestring = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# macOS utun support
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
