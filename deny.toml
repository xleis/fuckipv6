# Supply-chain policy for shipped release targets. This file is consumed by
# scripts/supply-chain-audit.sh and the Verify workflow.

[graph]
# Audit the union of release targets rather than only the host platform.
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Accepted, documented residual risks. The security report keeps the warning
# visible: the way out is removing the crate from the graph, not deleting the
# entry.
ignore = [
    # rsa 0.10.0-rc.19 already carries the crypto-bigint migration and the
    # constant-time mitigations the advisory asks for; only the prerelease tag
    # keeps it below the fixed range. It reaches us through webauthn attestation
    # verification on the owner's own machine. Upgrade once 0.10.0 ships.
    "RUSTSEC-2023-0071",
    # Unmaintained notices from the GPUI, webauthn and desktop session stacks.
    # None of these describe a vulnerability; each names the crate to move to.
    "RUSTSEC-2026-0543", # chrono, pinned by the desktop session and audit code
    "RUSTSEC-2024-0384", # instant, wasm shim under the GPUI stack
    "RUSTSEC-2024-0436", # paste, proc-macro dependency of the rendering stack
    "RUSTSEC-2025-0134", # rustls-pemfile, thin wrapper over rustls-pki-types
    "RUSTSEC-2026-0206", # rustybuzz, text shaping inside GPUI
    "RUSTSEC-2026-0192", # ttf-parser, font parsing inside GPUI
    "RUSTSEC-2026-0371", # zbus_names, D-Bus names in the Linux session stack
    "RUSTSEC-2026-0370", # zvariant, D-Bus wire types in the same stack
    "RUSTSEC-2026-0372", # zvariant_derive, derive crate for zvariant
]

[licenses]
# Explicitly allow only permissive licenses used by the locked dependency graph.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT-0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
    # File-scoped weak copyleft. Used by the cbindgen build helper, the
    # webauthn crypto glue, and the dwrote/option-ext font and path helpers in
    # the GPUI stack; none of them are modified or redistributed as source.
    "MPL-2.0",
    # Zero-clause BSD, used by doctest-file through the iOS bridge harness.
    "0BSD",
    # Community Data License Agreement, used for the bundled root certificate
    # data in webpki-roots.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# A duplicate must be removed or documented below with a narrow version pin.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

# These are deliberately pinned to exact versions. An unversioned skip would
# silently accept future duplicates, so every exception must be revisited when
# the lockfile changes.
skip = [
    # FIPS 203/204 crates currently use RustCrypto 0.11, while the stable
    # X25519/Ed25519 and AEAD crates still use RustCrypto 0.10.
    { crate = "chacha20@0.9.1", reason = "RustCrypto 0.10 AEAD compatibility" },
    { crate = "cpufeatures@0.2.17", reason = "RustCrypto 0.10 digest backend" },
    { crate = "crypto-common@0.1.7", reason = "RustCrypto 0.10 trait ecosystem" },
    { crate = "digest@0.10.7", reason = "RustCrypto 0.10 SHA/HMAC compatibility" },
    { crate = "signature@2.2.0", reason = "ed25519-dalek 2.x compatibility" },

    # The dependency graph spans getrandom 0.2 (legacy RustCrypto), 0.3 (our
    # direct dependency), and 0.4 (quinn's rand 0.10).
    { crate = "getrandom@0.2.17", reason = "legacy RustCrypto rand_core dependency" },
    { crate = "getrandom@0.3.4", reason = "workspace direct random source" },
    { crate = "rand@0.9.5", reason = "tungstenite random dependency" },
    { crate = "rand_core@0.6.4", reason = "legacy RustCrypto compatibility" },
    { crate = "rand_core@0.9.5", reason = "tungstenite rand compatibility" },

    # Proc-macro crates independently select syn 1/2/3; Cargo does not provide
    # a workspace-level way to force transitive macro dependencies to one syn.
    { crate = "syn@1.0.109", reason = "wintun 0.3 derive dependency" },
    { crate = "syn@2.0.119", reason = "current proc-macro dependency graph" },

    # These crates are also pulled transitively by x509-parser/tun and by
    # quinn/tungstenite, which currently select different major versions.
    { crate = "thiserror@1.0.69", reason = "x509-parser and tun compatibility" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1.x implementation" },

    # Windows FFI versions are selected independently by ring/rustls and
    # wintun/tun. Only the exact legacy versions are tolerated.
    { crate = "windows-core@0.51.1", reason = "wintun/tun Windows API compatibility" },
    { crate = "windows-sys@0.52.0", reason = "ring/rustls Windows API compatibility" },
    { crate = "windows-sys@0.59.0", reason = "direct Windows TUN API compatibility" },
    { crate = "windows-targets@0.48.5", reason = "windows-sys 0.52 compatibility" },
    { crate = "windows_x86_64_gnu@0.48.5", reason = "windows-targets 0.48 compatibility" },
    { crate = "wintun@0.3.2", reason = "tun 0.6 Windows backend" },

    # 2026-11-21 dependency-tree snapshot: each pair below still selects two
    # majors because the dependent lines have not unified yet. Entries are exact
    # versions, so a future third version still fails the gate.
    { crate = "aead@0.5.2", reason = "required by aes-gcm 0.10.3" },
    { crate = "aes@0.8.4", reason = "required by aes-gcm 0.10.3" },
    { crate = "aes-gcm@0.10.3", reason = "required by fuckipv6-secure-session 0.3.0" },
    { crate = "asn1-rs@0.6.2", reason = "required by der-parser 9.0.0" },
    { crate = "asn1-rs-derive@0.5.1", reason = "required by asn1-rs 0.6.2" },
    { crate = "base64@0.21.7", reason = "required by webauthn-rs-core 0.6.2" },
    { crate = "base64@0.22.1", reason = "required by axum 0.8.9" },
    { crate = "bit-set@0.9.1", reason = "required by naga 29.0.4" },
    { crate = "bit-vec@0.9.1", reason = "required by bit-set 0.9.1" },
    { crate = "bitflags@1.3.2", reason = "required by fluent-uri 0.1.4" },
    { crate = "block-buffer@0.10.4", reason = "required by digest 0.10.7" },
    { crate = "block-padding@0.3.3", reason = "required by inout 0.1.4" },
    { crate = "cbc@0.1.2", reason = "required by oo7 0.6.0" },
    { crate = "cipher@0.4.4", reason = "required by aes 0.8.4" },
    { crate = "convert_case@0.10.0", reason = "required by derive_more-impl 2.1.1" },
    { crate = "ctr@0.9.2", reason = "required by aes-gcm 0.10.3" },
    { crate = "der-parser@9.0.0", reason = "required by x509-parser 0.16.0" },
    { crate = "foldhash@0.1.5", reason = "required by hashbrown 0.15.5" },
    { crate = "font-types@0.11.3", reason = "required by read-fonts 0.37.0" },
    { crate = "ghash@0.5.1", reason = "required by aes-gcm 0.10.3" },
    { crate = "hashbrown@0.14.5", reason = "required by zed-xim 0.4.0-zed" },
    { crate = "hashbrown@0.15.5", reason = "required by gpu-descriptor 0.3.2" },
    { crate = "hashbrown@0.16.1", reason = "required by accesskit_consumer 0.38.0" },
    { crate = "heck@0.4.1", reason = "required by cbindgen 0.28.0" },
