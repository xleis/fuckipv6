name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Release verification
    uses: ./.github/workflows/verify.yml

  docker:
    name: Docker builds
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build coordinator image
        run: docker build -f Dockerfile.coordinator -t fuckipv6-coordinator:ci .

      - name: Build client image
        run: docker build -f Dockerfile.client -t fuckipv6-client:ci .
