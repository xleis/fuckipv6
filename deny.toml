    { crate = "oid-registry@0.7.1", reason = "required by x509-parser 0.16.0" },
    { crate = "pbkdf2@0.12.2", reason = "required by oo7 0.6.0" },
    { crate = "phf@0.11.3", reason = "required by markup5ever 0.12.1" },
