[package]
name = "fuckipv6-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fuckipv6-secure-session = { path = "../crates/secure-session", features = ["pq"] }

[[bin]]
name = "wire_decoders"
path = "fuzz_targets/wire_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_inputs"
path = "fuzz_targets/handshake_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_packet"
path = "fuzz_targets/data_packet.rs"
test = false
doc = false
bench = false

[workspace]
