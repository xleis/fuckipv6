services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    image: fuckipv6/coordinator:local
    container_name: fuckipv6-coordinator
    restart: unless-stopped
    ports:
      - "6666:6666"
      - "8080:8080"
    volumes:
      - ./examples/coordinator.toml.example:/etc/fuckipv6/coordinator.toml:ro

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: fuckipv6/client:local
    container_name: fuckipv6-client
    restart: unless-stopped
    profiles:
      - client
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./client.toml:/etc/fuckipv6/client.toml:ro
      - fuckipv6-client-state:/var/lib/fuckipv6

volumes:
  fuckipv6-client-state:
