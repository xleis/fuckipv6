[package]
name = "fuckipv6-ios-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Stable C ABI that hosts the embedded fuckipv6 node inside an iOS Packet Tunnel extension"

[lib]
name = "fuckipv6_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
fuckipv6-common = { version = "0.3.0", path = "../common" }
fuckipv6-client = { version = "0.3.0", path = "../client", default-features = false }
futures = { workspace = true }
ipnet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
