services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    image: fuckipv6/node:local
    container_name: fuckipv6
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - fuckipv6-state:/var/lib/fuckipv6
      - fuckipv6-config:/etc/fuckipv6

volumes:
  fuckipv6-state:
  fuckipv6-config:
